<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A* Pathfinding Visualization</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      --bg-card: #0f0f1a;
      --text-primary: #fff;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --btn-secondary: #374151;
      --btn-secondary-hover: #4b5563;
      --input-bg: #374151;
      --border-color: #374151;
      --stats-bg: #1f2937;
      --canvas-bg: #0f0f1a;
      --grid-color: #28283c;
      --wall-color: #3d3d5c;
    }

    body.light-theme {
      --bg-body: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --btn-secondary: #e2e8f0;
      --btn-secondary-hover: #cbd5e1;
      --input-bg: #e2e8f0;
      --border-color: #cbd5e1;
      --stats-bg: #f1f5f9;
      --canvas-bg: #ffffff;
      --grid-color: #e2e8f0;
      --wall-color: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: var(--bg-body);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      color: var(--text-primary);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 1100px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .canvas-wrapper {
      background: var(--canvas-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease;
    }

    .controls {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      width: 280px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease;
    }

    .controls h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #4f46e5;
      color: white;
    }

    .btn-primary:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--btn-secondary);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: var(--btn-secondary-hover);
    }

    .slider-group {
      margin-bottom: 20px;
    }

    .slider-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .slider-group input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--input-bg);
      appearance: none;
      cursor: pointer;
    }

    .slider-group input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #4f46e5;
      cursor: pointer;
    }

    .slider-value {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .checkbox-group {
      margin-bottom: 20px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    .stats {
      background: var(--stats-bg);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 20px;
      transition: background 0.3s ease;
    }

    .stats-value {
      font-size: 1.1rem;
      font-weight: 600;
      color: #10b981;
    }

    .instructions {
      background: var(--stats-bg);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.6;
      transition: background 0.3s ease;
    }

    .instructions strong {
      color: var(--text-primary);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }

    .legend-start { background: #22c55e; }
    .legend-end { background: #ef4444; }
    .legend-open { background: rgba(52, 211, 153, 0.8); }
    .legend-closed { background: rgba(244, 114, 182, 0.8); }
    .legend-wall { background: var(--wall-color); }
    .legend-path { background: #60a5fa; }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: var(--stats-bg);
      border-radius: 8px;
      cursor: pointer;
    }

    .theme-toggle input {
      display: none;
    }

    .toggle-slider {
      width: 44px;
      height: 24px;
      background: var(--btn-secondary);
      border-radius: 12px;
      position: relative;
      transition: background 0.3s ease;
    }

    .toggle-slider::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.3s ease;
    }

    .theme-toggle input:checked + .toggle-slider {
      background: #4f46e5;
    }

    .theme-toggle input:checked + .toggle-slider::after {
      transform: translateX(20px);
    }

    .toggle-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: color 0.3s ease;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      
      .controls {
        width: 100%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-wrapper">
      <div id="canvas-container"></div>
    </div>

    <div class="controls">
      <h2>Controls</h2>
      
      <label class="theme-toggle">
        <input type="checkbox" id="themeToggle">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Light</span>
      </label>
      
      <div class="btn-group">
        <button class="btn btn-primary" onclick="startSearch()">Start (B)</button>
        <button class="btn btn-secondary" onclick="restartLevel()">Restart (R)</button>
        <button class="btn btn-secondary" onclick="reset()">Reset</button>
      </div>

      <div class="slider-group">
        <label>Grid Size</label>
        <input type="range" id="gridSize" min="5" max="50" value="25" onchange="setSizeOfGrid()">
        <div class="slider-value" id="gridSizeValue">25</div>
      </div>

      <div class="slider-group">
        <label>Wall Density</label>
        <input type="range" id="wallDensity" min="0" max="100" value="25">
        <div class="slider-value" id="wallDensityValue">25%</div>
      </div>

      <button class="btn btn-secondary" onclick="generateWalls()" style="width: 100%; margin-bottom: 20px;">Generate Walls (G)</button>

      <div class="checkbox-group">
        <label><input type="checkbox" id="manh" onchange="setHeuristic(1)"> Manhattan</label>
        <label><input type="checkbox" id="pyth" checked onchange="setHeuristic(2)"> Pythagorean</label>
        <label><input type="checkbox" id="squares" onchange="setHeuristic(3)"> Square</label>
      </div>

      <div class="stats">
        <div class="stats-value" id="runInfo">Steps: 0 | Time: 0s</div>
      </div>

      <div class="instructions">
        <strong>LMB</strong> - Build wall<br>
        <strong>RMB</strong> - Remove wall<br>
        <strong>Drag</strong> - Move start/target<br>
        <strong>G</strong> - Generate walls<br>
        <strong>B</strong> - Start search<br>
        <strong>R</strong> - Restart
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-color legend-start"></div>Start</div>
        <div class="legend-item"><div class="legend-color legend-end"></div>Target</div>
        <div class="legend-item"><div class="legend-color legend-open"></div>Open</div>
        <div class="legend-item"><div class="legend-color legend-closed"></div>Closed</div>
        <div class="legend-item"><div class="legend-color legend-wall"></div>Wall</div>
        <div class="legend-item"><div class="legend-color legend-path"></div>Path</div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.dom.min.js"></script>
  <script src="Node.js"></script>
  <script src="newRes.js"></script>
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    
    function setTheme(isLight) {
      if (isLight) {
        body.classList.add('light-theme');
        themeToggle.checked = true;
        document.querySelector('.toggle-label').textContent = 'Dark';
        AStar.isLightTheme = true;
      } else {
        body.classList.remove('light-theme');
        themeToggle.checked = false;
        document.querySelector('.toggle-label').textContent = 'Light';
        AStar.isLightTheme = false;
      }
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      updateThemeColors();
      loop();
    }
    
    themeToggle.addEventListener('change', function() {
      setTheme(this.checked);
    });
    
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
      setTheme(true);
    } else {
      updateThemeColors();
    }
    
    document.getElementById('gridSize').addEventListener('input', function() {
      document.getElementById('gridSizeValue').textContent = this.value;
    });
    document.getElementById('wallDensity').addEventListener('input', function() {
      document.getElementById('wallDensityValue').textContent = this.value + '%';
    });
  </script>
</body>
</html>
